<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Organizador · Sorteo Fase 2</title>
<style>
  :root{--bg:#f4f6fb; --card:#fff; --border:#d9e0ee; --ink:#0b1b3f; --sub:#5a6788; --gold:#f2b632; --green:#0a7f5b; --green-bg:#d4f2e7; --amber:#e0a100; --amber-bg:#fff4d6; --red:#b3261e; --blue-bg:#dce5ff;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#0a1330; --card:#111c44; --border:#26356e; --ink:#e8eeff; --sub:#9db0dd; --green:#3fd9a0; --green-bg:#0f3b33; --amber-bg:#3a2e0b; --red:#ff8a80; --blue-bg:#1c2e6b; color-scheme:dark;} }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; padding:18px 16px 60px;}
  .wrap{max-width:900px; margin:0 auto;}
  h1{margin:0 0 4px; font-size:1.6rem;}
  .section-title{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 0 6px;}
  .ttl{font-weight:800;}
  .tag{background:var(--gold); color:#3a2400; border-radius:10px; padding:2px 10px; font-size:.75rem; font-weight:800;}
  .fecha-sub{color:var(--sub); font-size:.85rem;}
  .pend{background:var(--amber-bg); border:1px solid var(--amber); border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:.85rem;}
  .close-btn{display:block; width:100%; min-height:46px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink); font:inherit; font-weight:700; cursor:pointer; margin:0 0 8px; padding:8px 12px;}
  .close-btn:disabled{opacity:.45; cursor:default;}
  .qchip{border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:14px; padding:6px 12px; font:inherit; font-size:.8rem; font-weight:700; cursor:pointer; text-decoration:none;}
  .qchip.on{background:var(--gold); color:#3a2400; border-color:transparent;}
  .teamsel{font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; min-height:44px; width:100%;}
  details{margin:6px 0 12px;}
  a{color:inherit;}
  .srt-h{margin:20px 0 8px; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sub);}
  .srt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:10px;}
  .srt-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .srt-card > b{display:block; margin-bottom:4px;}
  .srt-row{display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px solid var(--border); font-size:.85rem;}
  .srt-row.cut{border-top:2px dashed var(--gold);}
  .srt-row .n{width:2.6em; color:var(--sub); flex:none;}
  .srt-row .t{flex:1; min-width:0;}
  .srt-row .p{color:var(--sub); font-size:.72rem; white-space:nowrap;}
  .srt-row button{border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:8px; width:32px; height:32px; font:inherit; cursor:pointer;}
  .srt-row button:disabled{opacity:.3;}
  .srt-row code{font-weight:700; letter-spacing:.08em;}
  .srt-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .srt-chips button{background:none; border:0; font:inherit; font-weight:800; cursor:pointer; color:inherit;}
  .srt-form{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px;}
  .srt-form .teamsel{flex:1 1 150px; width:auto;}
  #liveAdm:not(:empty){background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin:14px 0;}
  .live-h{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .live-n{font-size:1.6rem; font-weight:800;} .live-n small{font-size:.9rem; color:var(--sub);}
  .pill{display:inline-flex; align-items:center; gap:8px; font-size:.82rem; color:var(--sub); font-weight:600;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--sub);}
  .dot.on{background:#E5322D; box-shadow:0 0 0 3px rgba(229,50,45,.25); animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}
  .live-bars{display:grid; gap:6px; margin:10px 0;}
  .bar{display:grid; grid-template-columns:4.6rem 1fr 3rem; gap:10px; align-items:center; font-size:.85rem;}
  .bar .tr{height:10px; background:var(--border); border-radius:5px; overflow:hidden;} .bar .tr i{display:block; height:100%; background:#E5322D;}
  .bar b{text-align:right;}
  .live-day{margin:14px 0 4px; font-weight:800; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sub);}
  .live-row{display:grid; grid-template-columns:3.2rem auto minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--border); font-size:.84rem;}
  .live-row:not(.done){opacity:.6;} .live-row .vs i{font-style:normal; color:var(--sub);} .live-row .st{font-size:.76rem; white-space:nowrap;}
  .chip{font-size:.7rem; font-weight:700; padding:2px 7px; border-radius:4px; white-space:nowrap;} .chip.SM{background:var(--blue-bg);} .chip.SA{background:var(--green-bg);}
  .live-feed{padding:5px 0; border-top:1px solid var(--border); font-size:.84rem;}
  @media (max-width:560px){ .live-row{grid-template-columns:3rem minmax(0,1fr) auto;} .live-row .chip{display:none;} }
  .srt-sec{background:var(--card); border:1px solid var(--border); border-radius:14px; margin:12px 0; padding:0 14px;}
  .srt-sec > summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0; font-size:.82rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--sub);}
  .srt-sec > summary::-webkit-details-marker{display:none;}
  .srt-sec > summary::after{content:'▾'; font-size:1rem; transition:transform .2s; flex:none;}
  .srt-sec:not([open]) > summary::after{transform:rotate(-90deg);}
  .srt-sec > summary small{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;}
  .srt-sec .srt-body{padding:0 0 12px;}
  #liveAdm:not(:empty){padding:0; border:0; background:none; margin:14px 0 0;}
  .srt-sec.live > summary{text-transform:none; letter-spacing:0; color:var(--ink); flex-wrap:wrap;}
  .srt-sec.live > summary .pill{margin-left:auto;}
  #toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#0b1b3f; color:#fff; padding:10px 16px; border-radius:10px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; z-index:9;}
  #toast.on{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Sorteo Fase 2 · Organizador</h1>
  <p class="fecha-sub" style="margin:0">Keeper Cup 3 · Copa Oro (puestos 1–4) y Copa Plata (5–8) · Fechas 1, 2 y 3 de la Fase 2 (8, 9 y 10 del torneo). Solo para el organizador: los DT entran por el link que se genera abajo.</p>
  <div id="tokenBox"></div>
  <div id="liveAdm"></div>
  <div class="section-title"><span class="ttl">Estado</span><span class="tag" id="srtTag">sin publicar</span></div>
  <div id="sorteoBox"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="sorteo-core.js"></script>
<script>
/* Utilidades mínimas. El token de GitHub (permiso gist) es el mismo de la herramienta del torneo:
   como las dos páginas están en dmaflaf.github.io, se reutiliza el que ya está guardado en este navegador. */
const esc = s => String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const escAttr = s => String(s).replace(/"/g,'&quot;');
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 3500); }
const TOK_OWN = 'kc3s_token', TOK_APP = 'kc3_github_v1';
const cloud = {c:null};
function loadToken(){
  try{ const o = localStorage.getItem(TOK_OWN); if(o){ cloud.c = {t:o}; return; } }catch(e){}
  try{ const a = JSON.parse(localStorage.getItem(TOK_APP) || 'null'); if(a && a.t) cloud.c = {t:a.t}; }catch(e){}
}
loadToken();
async function gh(path, opts = {}){
  return fetch('https://api.github.com' + path, {method:opts.method || 'GET', cache:'no-store',
    headers:Object.assign({'Authorization':'Bearer ' + cloud.c.t, 'Accept':'application/vnd.github+json'}, opts.body ? {'Content-Type':'application/json'} : {}),
    body:opts.body ? JSON.stringify(opts.body) : undefined});
}
async function ghFail(r){ const e = new Error(r.status === 401 ? 'token' : r.status === 403 ? 'perm' : 'http ' + r.status); try{ const j = await r.json(); e.detail = j.message; }catch(x){} throw e; }
const cloudErrorText = e => e.message === 'token' ? 'el token venció o no es válido' : e.message === 'perm' ? 'el token no tiene permiso gist (o GitHub pidió esperar)' : /fetch|network/i.test(e.message) ? 'sin internet' : (e.detail || e.message);
function renderToken(){
  const b = document.getElementById('tokenBox');
  b.innerHTML = cloud.c ? '<p class="fecha-sub" style="margin:10px 0 0">🔑 Conectado con tu GitHub. <button type="button" class="qchip" id="tokOut">Cambiar token</button></p>'
    : '<div class="pend" style="margin-top:12px"><b>Conecta tu GitHub</b> (el mismo token con permiso <b>gist</b> de la herramienta del torneo). Se guarda solo en este navegador.<div class="srt-form" style="margin-top:8px"><input id="tokIn" class="teamsel" placeholder="ghp_…" autocomplete="off"><button type="button" class="qchip on" id="tokGo">Conectar</button></div><a class="fecha-sub" target="_blank" rel="noopener" href="https://github.com/settings/tokens/new?scopes=gist&description=Keeper%20Cup%203%20sorteo">Crear un token nuevo con permiso gist</a></div>';
  const go = document.getElementById('tokGo'), out = document.getElementById('tokOut');
  if(go) go.onclick = ()=>{ const v = document.getElementById('tokIn').value.trim(); if(!v) return; try{ localStorage.setItem(TOK_OWN, v); }catch(e){} cloud.c = {t:v}; srt.loaded = false; renderToken(); renderSorteo(); srtLoadRemote(); };
  if(out) out.onclick = ()=>{ try{ localStorage.removeItem(TOK_OWN); }catch(e){} cloud.c = null; renderToken(); renderSorteo(); };
}
const groupOrder = ['A','B','C','D'], groupNames = {A:'Grupo A', B:'Grupo B', C:'Grupo C', D:'Grupo D'};
const computeStandings = g => [];
</script>
<script>
/* ---- Sorteo Fase 2: el organizador prepara la tabla final, los pedidos y la semilla, publica el link para los DT,
   abre/cierra el sorteo y al final lo carga en el fixture. La configuración va a un gist aparte (solo lectura para los DT);
   lo que saca cada DT viaja por ntfy.sh para el panel en vivo. El resultado lo fija la semilla. ---- */
const SRT_FILE = 'sorteo-fase2.json', SRT_DESC = 'Keeper Cup 3 sorteo fase 2', SRT_KEY = 'kc3_sorteo_v1';
const SRT_DATES = [[13,14,15],[20,21,22],[27,28,29]];
/* Tabla final oficial de la Fase 1 (publicada el 11 de noviembre), con los nombres que usa esta herramienta. */
const SRT_OFICIAL = {
  A:['Barrio Fino','Cordovez','Huracán','Gladiadores AZ','Galacticos','Alianza Jr.','Arapaima','Corintians'],
  B:['Leones','Sub 21','Mandela','Templo Fit','Libert','Real Sevilla','Jolines','Pecezuelos'],
  C:['Vaster','Somec','Barcelona','La Banda','Real Potosí','Cormoran','San Francisco','San Andres'],
  D:['Leipzig','Legacy','Clowiss','Randagi','America','Universitarios','San José','Juventus']};
const SRT_PEDIDOS0 = {Legacy:'noSab', Clowiss:'sab19', Barcelona:'sab17', Leones:'fDVS'};
const srt = {d:null, cfg:null, busy:false, msg:'', check:null, checkKey:''};
try{ const raw = localStorage.getItem(SRT_KEY); if(raw) srt.d = JSON.parse(raw); }catch(e){}
function srtSave(){ try{ localStorage.setItem(SRT_KEY, JSON.stringify(srt.d)); }catch(e){} }
const srtSeed = ()=>{ let s = ''; while(s.length < 6) s += Math.random().toString(36).slice(2).toUpperCase().replace(/[^A-Z0-9]/g,''); return s.slice(0,6); };
const srtTopic = ()=>'kc3-f2-' + Array.from(crypto.getRandomValues(new Uint8Array(9))).map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,14);
function srtTable(){ const o = {}; groupOrder.forEach(g=>{ o[g] = computeStandings(g).map(r=>r.team); }); return o; }
function srtDraft(){
  if(!srt.d) srt.d = {};
  const d = srt.d;
  if(!d.ofv){ d.orig = JSON.parse(JSON.stringify(SRT_OFICIAL)); d.ofv = 1; }
  if(!d.orig || groupOrder.some(g=>!Array.isArray(d.orig[g]) || d.orig[g].length !== roster[g].length || d.orig[g].some(t=>!roster[g].includes(t)))) d.orig = JSON.parse(JSON.stringify(SRT_OFICIAL));
  if(!d.pedidos) d.pedidos = Object.assign({}, SRT_PEDIDOS0);
  if(!d.seed) d.seed = srtSeed();
  if(d.abre === undefined) d.abre = 'hoy a las 20h00';
  return d;
}
const srtKeyOf = d=>JSON.stringify([d.orig, d.pedidos, d.seed]);
function srtRun(d){
  const k = srtKeyOf(d);
  if(srt.checkKey !== k){
    const K = KCDraw.create(d.orig, d.pedidos), res = K.runDraw(d.seed, K.DEFAULT_RESTR, true);
    srt.check = {K, res, checks: res ? K.verify(res, K.DEFAULT_RESTR, true) : null}; srt.checkKey = k;
  }
  return srt.check;
}
const srtLink = ()=>srt.d && srt.d.gist ? (location.protocol === 'file:' ? 'https://dmaflaf.github.io/kc3-sorteo-fase-2/' : new URL('./', location.href).href) + '?g=' + srt.d.owner + '/' + srt.d.gist : '';
const srtMsg = (K, i)=>`Hola DT de ${K.TEAMS[i].name} 👋 Sorteo de horarios de la Fase 2 de la Keeper Cup 3 (Fechas 1, 2 y 3). Entra a ${srtLink()} y escribe tu código ${K.CODES[i]}. Ahí sacas tu rival, día, hora y estadio de cada fecha y ves el panel en vivo.`;
async function srtGistFind(){
  for(let page = 1; page <= 3; page++){
    const r = await gh('/gists?per_page=100&page=' + page); if(!r.ok) await ghFail(r);
    const list = await r.json(), hit = list.find(g=>g.description === SRT_DESC && g.files && g.files[SRT_FILE]);
    if(hit) return hit;
    if(list.length < 100) break;
  }
  return null;
}
async function srtPublish(patch, label){
  if(!cloud.c){ toast('Primero conecta la nube (arriba) en este dispositivo'); return false; }
  const d = srtDraft();
  srt.busy = true; renderSorteo();
  try{
    if(!d.gist){ const hit = await srtGistFind(); if(hit){ d.gist = hit.id; d.owner = hit.owner && hit.owner.login; } }
    const cfg = Object.assign({v:1, seed:d.seed, variety:true, orig:d.orig, pedidos:d.pedidos, topic:d.topic || srtTopic(), open:false, test:false, abre:d.abre, dates:SRT_DATES, mes:'nov', at:Date.now()}, srt.cfg || {}, {seed:d.seed, orig:d.orig, pedidos:d.pedidos, abre:d.abre}, patch);
    const body = {files:{[SRT_FILE]:{content:JSON.stringify(cfg, null, 1)}}};
    let r;
    if(d.gist) r = await gh('/gists/' + d.gist, {method:'PATCH', body});
    else r = await gh('/gists', {method:'POST', body:Object.assign({description:SRT_DESC, public:false}, body)});
    if(!r.ok) await ghFail(r);
    const j = await r.json(); d.gist = j.id; d.owner = (j.owner && j.owner.login) || d.owner || 'dmaflaf'; d.topic = cfg.topic;
    srt.cfg = cfg; srtSave(); toast(label || 'Sorteo publicado'); return true;
  }catch(e){ toast('No se pudo publicar: ' + cloudErrorText(e)); return false; }
  finally{ srt.busy = false; renderSorteo(); }
}
async function srtLoadRemote(){
  if(!cloud.c || srt.loaded) return; srt.loaded = true;
  try{
    const d = srtDraft(); let id = d.gist;
    if(!id){ const hit = await srtGistFind(); if(hit){ id = d.gist = hit.id; d.owner = hit.owner && hit.owner.login; } }
    if(!id) return;
    const r = await gh('/gists/' + id); if(!r.ok) return;
    const j = await r.json(), f = j.files && j.files[SRT_FILE]; if(!f) return;
    const c = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
    srt.cfg = c; Object.assign(d, {topic:c.topic, owner:(j.owner && j.owner.login) || d.owner});
    if(!c.test) Object.assign(d, {seed:c.seed, orig:c.orig, pedidos:c.pedidos, abre:c.abre || d.abre});
    srtSave(); renderSorteo();
  }catch(e){ srt.loaded = false; }
}
const srtLocked = ()=>!!(srt.cfg && !srt.cfg.test && (srt.cfg.open || srt.cfg.closedAt));
function srtEdit(fn){
  if(srtLocked() && !confirm('El sorteo real ya se abrió. Cambiar la tabla, los pedidos o la semilla cambia TODOS los resultados. ¿Seguro?')) return;
  fn(srtDraft()); srtSave(); renderSorteo();
}
const SECS_KEY = 'kc3s_secs';
let srtSecs = {}; try{ srtSecs = JSON.parse(localStorage.getItem(SECS_KEY) || '{}') || {}; }catch(e){}
const srtSecOpen = k=>srtSecs[k] !== false;
function srtSecToggle(e){
  const el = e.target; if(!el.classList || !el.classList.contains('srt-sec')) return;
  srtSecs[el.dataset.sec] = el.open; try{ localStorage.setItem(SECS_KEY, JSON.stringify(srtSecs)); }catch(x){}
  if(el.dataset.sec === 'live'){ const b = document.getElementById('liveAdm'); b.dataset.h = ''; }
}
function renderSorteo(){
  const box = document.getElementById('sorteoBox'); if(!box) return;
  const d = srtDraft(), c = srt.cfg, ck = srtRun(d), K = ck.K, okAll = ck.res && ck.checks.every(x=>x.ok);
  const st = !c ? 'sin publicar' : c.test ? '🧪 prueba ' + (c.open ? 'abierta' : 'cerrada') : c.open ? '🟢 abierto' : c.closedAt ? '⛔ cerrado' : '🔒 publicado, sin abrir';
  document.getElementById('srtTag').textContent = st;
  const differs = c && srtKeyOf(d) !== srtKeyOf(c);
  const K0 = KCDraw.create(d.orig, {}), RL = K0.RESTR;
  let h = '';
  if(!cloud.c) h += `<div class="pend" style="border-color:var(--red)">⚠️ Conecta la nube en este dispositivo para poder publicar el sorteo.</div>`;
  // 1 tabla
  const isOf = JSON.stringify(d.orig) === JSON.stringify(SRT_OFICIAL), appT = srtTable(), appDif = groupOrder.filter(g=>JSON.stringify(appT[g]) !== JSON.stringify(SRT_OFICIAL[g]));
  h += `<h4 class="srt-h">1 · Tabla final de la Fase 1</h4><p class="fecha-sub" style="margin:0 0 8px">${isOf ? '✅ Es la tabla oficial publicada.' : '✏️ Cambiaste el orden de la tabla oficial.'} Puedes mover un equipo con ↑ ↓ si hiciera falta.</p>${appDif.length ? `<div class="pend">⚠️ Los resultados cargados en esta herramienta dan otro orden en ${appDif.map(g=>groupNames[g]).join(', ')}: revisa los marcadores en Fixture. El sorteo usa la tabla oficial.</div>` : ''}<div class="srt-grid">`;
  groupOrder.forEach(g=>{
    const rows = computeStandings(g), by = {}; rows.forEach(r=>by[r.team] = r);
    h += `<div class="srt-card"><b>${groupNames[g]}</b>${d.orig[g].map((t,i)=>{ const r = by[t], nx = by[d.orig[g][i+1]], pv = by[d.orig[g][i-1]];
      const tie = r && ((nx && nx.pts===r.pts && nx.gf-nx.gc===r.gf-r.gc) || (pv && pv.pts===r.pts && pv.gf-pv.gc===r.gf-r.gc));
      return `<div class="srt-row${i===4?' cut':''}"><span class="n">${i+1}º</span><span class="t">${esc(t)}${tie?' <i title="Empate en puntos y diferencia">⚖️</i>':''}</span><span class="p">${r ? r.pts + ' pts · ' + (r.gf-r.gc >= 0 ? '+' : '') + (r.gf-r.gc) : ''}</span><button type="button" data-srt="up" data-g="${g}" data-i="${i}" ${i?'':'disabled'} aria-label="Subir">↑</button><button type="button" data-srt="down" data-g="${g}" data-i="${i}" ${i<7?'':'disabled'} aria-label="Bajar">↓</button></div>`; }).join('')}</div>`;
  });
  h += `</div><button type="button" class="close-btn" data-srt="retable" style="margin:6px 0 4px">↻ Volver a la tabla oficial</button>`;
  // 2 pedidos
  h += `<h4 class="srt-h">2 · Pedidos de los clubes</h4><div class="srt-chips">${Object.keys(d.pedidos).map(n=>`<span class="qchip on">${esc(n)} · ${esc(K0.restrLabel(d.pedidos[n]))} <button type="button" data-srt="delped" data-n="${escAttr(n)}" aria-label="Quitar">×</button></span>`).join('') || '<span class="fecha-sub">Sin pedidos</span>'}</div>
    <div class="srt-form"><select id="srtPT" class="teamsel">${groupOrder.flatMap(g=>roster[g]).sort((a,b)=>a.localeCompare(b,'es')).map(t=>`<option>${esc(t)}</option>`).join('')}</select><select id="srtPC" class="teamsel" onchange="document.getElementById('srtCus').hidden = this.value !== 'custom'"><option value="custom">📅 Días por fecha (a elección)…</option>${Object.keys(RL).filter(k=>k !== 'fixDVS').map(k=>`<option value="${k}">${esc(RL[k])}</option>`).join('')}</select><button type="button" class="qchip" data-srt="addped">Agregar</button></div>

  box.innerHTML = h;

/* ---- En vivo para el organizador: lo que van sacando los DT (vía ntfy.sh) y lo que falta ---- */
const LIVE = {key:'', es:null, poll:0, fails:0, msgs:new Map(), lastId:'', K:null, res:null, cfg:null, f:0, on:false};
const SHORTD = ['Vie','Sáb','Dom'];
function liveSync(){
  const c = srt.cfg, box = document.getElementById('liveAdm');
  if(!c || !c.topic){ box.innerHTML = ''; box.dataset.h = ''; return; }
  const key = c.topic + '|' + c.seed + '|' + JSON.stringify(c.orig) + JSON.stringify(c.pedidos);
  if(key !== LIVE.key){
    if(LIVE.es) LIVE.es.close(); clearTimeout(LIVE.poll);
    LIVE.key = key; LIVE.msgs = new Map(); LIVE.lastId = ''; LIVE.fails = 0; LIVE.cfg = c;
    LIVE.K = KCDraw.create(c.orig, c.pedidos); LIVE.res = LIVE.K.runDraw(c.seed, LIVE.K.DEFAULT_RESTR, c.variety !== false);
    liveConnect(c.topic);
  }
  LIVE.cfg = c; liveRender();
}
function liveMsg(o){
  if(!o || o.event !== 'message' || !o.id || LIVE.msgs.has(o.id)) return false;
  let x = null; try{ x = JSON.parse(o.message); }catch(e){ return false; }
  LIVE.msgs.set(o.id, {t:o.time || 0, x}); LIVE.lastId = o.id; return true;
}
function liveConnect(topic){
  const url = 'https://ntfy.sh/' + encodeURIComponent(topic);
  const poll = async ()=>{
    try{ const r = await fetch(url + '/json?poll=1&since=' + (LIVE.lastId || 'all'), {cache:'no-store'}); if(!r.ok) throw 0;
      let ch = false; (await r.text()).split('\n').forEach(l=>{ if(l.trim()){ try{ if(liveMsg(JSON.parse(l))) ch = true; }catch(e){} } });
      LIVE.on = true; liveRender();
    }catch(e){ LIVE.on = false; liveRender(); }
    LIVE.poll = setTimeout(poll, 6000);
  };
  if(typeof EventSource !== 'function'){ poll(); return; }
  const es = new EventSource(url + '/sse?since=all'); LIVE.es = es;
  es.onopen = ()=>{ LIVE.on = true; LIVE.fails = 0; liveRender(); };
  es.onmessage = ev=>{ try{ if(liveMsg(JSON.parse(ev.data))) liveRender(); }catch(e){} };
  es.onerror = ()=>{ LIVE.on = false; liveRender(); if(++LIVE.fails >= 4){ es.close(); LIVE.es = null; poll(); } };
}
function liveDrawn(){
  const res = LIVE.res, out = new Map(); if(!res) return out;
  Array.from(LIVE.msgs.values()).sort((a,b)=>a.t-b.t).forEach(({t, x})=>{
    if(x && x.k === 'fill' && x.seed === LIVE.cfg.seed && Array.isArray(x.mis)){ x.mis.forEach(mi=>{ if(Number.isInteger(mi) && res.matches[mi] && !out.has(mi)) out.set(mi, {by:-1, at:t*1000}); }); return; }
    if(!x || x.k !== 'draw' || x.seed !== LIVE.cfg.seed || !Number.isInteger(x.mi) || !res.matches[x.mi] || out.has(x.mi)) return;
    const m = res.matches[x.mi]; if(x.by !== m.a && x.by !== m.b) return;
    out.set(x.mi, {by:x.by, at:(x.at && Math.abs(x.at - t*1000) < 6e5) ? x.at : t*1000});
  });
  return out;
}
function liveRender(){
  const box = document.getElementById('liveAdm'), c = LIVE.cfg, K = LIVE.K, res = LIVE.res;
  if(!c || !res){ box.innerHTML = ''; box.dataset.h = ''; return; }
  const D = liveDrawn(), T = K.TEAMS, f = LIVE.f, hh = ts=>new Date(ts).toLocaleTimeString('es-EC', {hour:'2-digit', minute:'2-digit'});
  const per = [0,1,2].map(j=>res.matches.filter((m,i)=>m.j===j && D.has(i)).length), tot = per[0]+per[1]+per[2];
  const est = c.test ? 'Prueba' : c.open ? 'Abierto' : c.closedAt ? 'Cerrado' : 'Sin abrir';
  let h = `<details class="srt-sec live" data-sec="live"${srtSecOpen('live') ? ' open' : ''}><summary class="live-h"><span class="ttl">📡 En vivo</span><span class="live-n">${tot}<small> / 48</small></span><span class="pill"><i class="dot${LIVE.on ? ' on' : ''}"></i>${LIVE.on ? 'Conectado' : 'Conectando…'} · ${est}</span></summary>`;
  h += `<div class="live-bars">${per.map((n,j)=>`<div class="bar"><span>Fecha ${j+1}</span><span class="tr"><i style="width:${Math.round(n/16*100)}%"></i></span><b>${n}/16</b></div>`).join('')}</div>`;
  const pend = res.matches.map((m,i)=>i).filter(i=>!D.has(i));
  if(pend.length && (c.open || c.test)) h += `<button type="button" class="close-btn" data-fill="1" style="background:#E5322D;color:#fff;border-color:transparent">⚡ Completar faltantes (${pend.length} partido${pend.length===1?'':'s'})</button><p class="fecha-sub" style="margin:-2px 0 10px">Para los clubes que no están presentes: saca de una vez todos los partidos que faltan. Aparecen en el panel de todos como «sorteado por el organizador». No cambia ningún resultado: los fija la semilla.</p>`;
  h += `<div class="srt-chips">${[0,1,2].map(j=>`<button type="button" class="qchip${j===f?' on':''}" data-lf="${j}">Fecha ${j+1}</button>`).join('')}</div>`;
  [0,1,2].forEach(d=>{
    const sls = K.SLOTS.filter(s=>s.dayIdx===d).sort((a,b)=>a.hour-b.hour || (a.st===b.st ? 0 : a.st==='SM' ? -1 : 1));
    h += `<div class="live-day">${K.DAYS[d]} ${c.dates && c.dates[f] ? c.dates[f][d] + ' nov' : ''}</div>`;
    sls.forEach(sl=>{
      const mi = res.matches.findIndex(m=>m.j===f && m.slot.id===sl.id), m = res.matches[mi], x = D.get(mi);
      h += `<div class="live-row${x ? ' done' : ''}"><span class="t">${sl.time}</span><span class="chip ${sl.st}">${sl.st === 'SM' ? 'San Miguel' : 'Los Sauces'}</span><span class="vs">${esc(T[m.a].name)} <i>vs</i> ${esc(T[m.b].name)} <small class="fecha-sub">${m.cup} G${m.g+1}</small></span><span class="st">${x ? (x.by === -1 ? '⚡ Organizador' : '✅ ' + esc(T[x.by].name)) + ' · ' + hh(x.at) : '⏳'}</span></div>`;
    });
  });
  const done = T.map(t=>res.matches.filter((m,i)=>(m.a===t.id||m.b===t.id) && D.has(i)).length);
  const falta = T.filter(t=>done[t.id] < 3);
  h += `<div class="live-day">Clubes que aún no terminan (${falta.length})</div><div class="srt-chips">${falta.map(t=>`<span class="qchip">${esc(t.name)} · ${done[t.id]}/3</span>`).join('') || '<span class="fecha-sub">Todos sacaron sus 3 fechas 🎉</span>'}</div>`;
  const rec = Array.from(D.entries()).sort((a,b)=>b[1].at-a[1].at).slice(0,10);
  h += `<div class="live-day">Últimos sorteos</div>${rec.length ? rec.map(([mi,x])=>{ const m = res.matches[mi], o = m.a===x.by ? m.b : m.a; if(x.by === -1) return `<div class="live-feed"><b>${hh(x.at)}</b> ⚡ Organizador completó la Fecha ${m.j+1}: ${esc(T[m.a].name)} vs ${esc(T[m.b].name)}, ${m.slot.day} ${m.slot.time}</div>`; return `<div class="live-feed"><b>${hh(x.at)}</b> ${esc(T[x.by].name)} sacó la Fecha ${m.j+1}: vs ${esc(T[o].name)}, ${m.slot.day} ${m.slot.time}, ${m.st === 'SM' ? 'San Miguel' : 'Los Sauces'}</div>`; }).join('') : '<p class="fecha-sub">Todavía nadie ha sorteado.</p>'}`;
  h += '</details>';
  if(box.dataset.h !== h){ box.innerHTML = h; box.dataset.h = h; }   /* sin cambios no se redibuja (los botones no se mueven bajo el dedo) */
}
document.getElementById('sorteoBox').addEventListener('toggle', srtSecToggle, true);

document.getElementById('sorteoBox').addEventListener('click', async e=>{

  }
  else if(a === 'pub'){ if(srt.cfg && srt.cfg.test){ d.topic = srtTopic(); } await srtPublish({test:false, open:false, closedAt:0, topic:d.topic || srtTopic()}, 'Sorteo publicado (todavía cerrado)'); }

    if(oldTopic) fetch('https://ntfy.sh/' + encodeURIComponent(oldTopic), {method:'POST', body:JSON.stringify({k:'reset'})}).catch(()=>{});
  }
  else if(a === 'close'){
    if(!confirm('¿Cerrar el sorteo? Los DT ya no podrán sacar horarios (sí ver sus resultados).')) return;
    const ok = await srtPublish({open:false, closedAt:Date.now()}, '⛔ Sorteo cerrado');
    if(ok && srt.cfg.topic) fetch('https://ntfy.sh/' + encodeURIComponent(srt.cfg.topic), {method:'POST', body:JSON.stringify({k:'close'})}).catch(()=>{});
  }
  else if(a === 'json' || a === 'csv'){
    const cfg = srt.cfg, K = KCDraw.create(cfg.orig, cfg.pedidos), res = K.runDraw(cfg.seed, K.DEFAULT_RESTR, cfg.variety !== false);
    const rows = res.matches.slice().sort((x,y)=>x.j-y.j || x.slot.dayIdx-y.slot.dayIdx || x.slot.hour-y.slot.hour).map(m=>({fecha:KCDraw.FECHA0 + m.j, fechaFase2:m.j + 1, copa:m.cup, grupo:m.g + 1, home:K.TEAMS[m.a].name, away:K.TEAMS[m.b].name, estadio:K.ST_NAME[m.st], dia:m.slot.day, fechaCal:(cfg.dates[m.j][m.slot.dayIdx]) + ' de noviembre', hora:m.slot.time}));
    const out = a === 'json'
      ? new Blob([JSON.stringify({torneo:'Keeper Cup 3', fase:2, semilla:cfg.seed, prueba:!!cfg.test, generado:new Date().toISOString(), grupos:['Oro','Plata'].flatMap(cup=>[0,1,2,3].map(g=>({copa:cup, grupo:g+1, equipos:K.TEAMS.filter(t=>t.cup===cup&&t.g===g).map(t=>({nombre:t.name, puesto:t.rank, grupoFase1:t.from, codigo:K.CODES[t.id]}))}))), partidos:rows}, null, 1)], {type:'application/json'})
      : new Blob(['\ufeffFecha;Copa;Grupo;Local;Visitante;Estadio;Dia;Fecha calendario;Hora\n' + rows.map(r=>[r.fecha,r.copa,r.grupo,r.home,r.away,r.estadio,r.dia,r.fechaCal,r.hora].join(';')).join('\n')], {type:'text/csv'});
    const u = URL.createObjectURL(out), l = document.createElement('a'); l.href = u; l.download = 'sorteo-fase2-' + cfg.seed + (cfg.test ? '-PRUEBA' : '') + '.' + a; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
  }
  else if(a === 'copylink' || a === 'copyall'){
    const ck = srtRun(d), txt = a === 'copylink' ? srtLink() : ck.K.TEAMS.map(t=>t.name + ' (' + ck.K.CODES[t.id] + '):\n' + srtMsg(ck.K, t.id)).join('\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Copiado'), ()=>{ b.insertAdjacentHTML('afterend', `<textarea class="teamsel" readonly style="height:120px" onclick="this.select()">${esc(txt)}</textarea>`); });
  }
});


const roster = {}; groupOrder.forEach(g=>{ roster[g] = SRT_OFICIAL[g].slice(); });
srtTable = ()=>JSON.parse(JSON.stringify(SRT_OFICIAL));
renderToken(); renderSorteo(); srtLoadRemote();
</script>
